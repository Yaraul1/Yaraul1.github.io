<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe8dc" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("yar-theme") || "system";
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode !== "light" &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? "dark" : "light";
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <meta
      name="description"
      content="Yaroslav Yuferev — AI Engineer. Личное портфолио в формате интерактивного рабочего стола Yar OS."
    />
    <meta property="og:title" content="Yaroslav Yuferev — AI Engineer | Yar OS" />
    <meta
      property="og:description"
      content="Личное пространство: проекты, идеи и искусственный интеллект."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/icons/favicon.svg" />
    <title>Yaroslav Yuferev — AI Engineer | Yar OS</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >Yaroslav Yuferev — AI Engineer. Для интерактивного портфолио включите
      JavaScript.</noscript
    >
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
