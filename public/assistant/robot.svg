<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 8 116 116">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d9dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="bg-light" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe1f2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3daee"/>
      <stop offset="1" stop-color="#aeb8d6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262e5c"/>
      <stop offset="1" stop-color="#10142d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#f0feff"/>
      <stop offset="0.5" stop-color="#76f1ff"/>
      <stop offset="1" stop-color="#2fb8ff"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="128" height="128" fill="url(#bg)"/>
  <rect width="128" height="128" fill="url(#bg-light)"/>

  <!-- shoulders and neck -->
  <path d="M22 128c0-15 10-24 26-25h32c16 1 26 10 26 25z" fill="url(#shell)"/>
  <rect x="53" y="92" width="22" height="13" rx="5" fill="url(#metal)"/>
  <ellipse cx="64" cy="102" rx="30" ry="4" fill="#1d2350" opacity="0.16"/>

  <!-- antenna with a glowing tip -->
  <path d="M64 39V27" stroke="#e7ebf7" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="22" r="8" fill="#7ff4ff" opacity="0.75" filter="url(#soft)"/>
  <circle cx="64" cy="22" r="5.5" fill="url(#glow)"/>

  <!-- ears -->
  <rect x="16" y="55" width="13" height="25" rx="6.5" fill="url(#metal)"/>
  <rect x="99" y="55" width="13" height="25" rx="6.5" fill="url(#metal)"/>

  <!-- head -->
  <rect x="23" y="35" width="82" height="63" rx="27" fill="url(#shell)"/>
  <path d="M40 41.5c9-2.6 21-3.4 31-2.4" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- face screen -->
  <rect x="32" y="48" width="64" height="39" rx="18" fill="url(#screen)"/>
  <path d="M41 53.5c6-1.6 14-2.1 21-1.6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.12"/>

  <!-- eyes with a soft glow -->
  <rect x="45" y="57.5" width="13" height="19" rx="6.5" fill="#6ef0ff" opacity="0.7" filter="url(#soft)"/>
  <rect x="70" y="57.5" width="13" height="19" rx="6.5" fill="#6ef0ff" opacity="0.7" filter="url(#soft)"/>
  <rect x="46.5" y="59" width="10" height="16" rx="5" fill="url(#glow)"/>
  <rect x="71.5" y="59" width="10" height="16" rx="5" fill="url(#glow)"/>

  <!-- smile -->
  <path d="M58.5 80.5q5.5 3.6 11 0" stroke="#8ff5ff" stroke-width="2.8" stroke-linecap="round" fill="none"/>
</svg>
